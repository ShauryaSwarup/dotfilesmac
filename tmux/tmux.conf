# Tell TPM (and plugins like catppuccin) where plugins live under the XDG path
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

# Pass Kiro CLI autocomplete link into new panes/windows
set -ga update-environment " Q_SET_PARENT"

# Accept OSC 52 clipboard writes from applications such as Neovim and relay them to iTerm2.
set-option -s set-clipboard on

# Kiro CLI: do not inherit the outer qterm marker into tmux panes.
# Each pane must launch its own kiro-cli-term wrapper.
set-environment -gu Q_TERM
set-environment -gu Q_TERM_TMUX

# Scrollback history
set -g history-limit 50000

# Keep mouse reporting enabled so accidental drags are swallowed by tmux instead of
# selecting text in iTerm2. Disable all mouse-driven scrolling and text copying;
# copy mode is intentionally keyboard-only.
set -g mouse on
unbind-key -T root MouseDrag1Pane
unbind-key -T root WheelUpPane
unbind-key -T root DoubleClick1Pane
unbind-key -T root TripleClick1Pane
unbind-key -T copy-mode MouseDrag1Pane
unbind-key -T copy-mode MouseDragEnd1Pane
unbind-key -T copy-mode WheelUpPane
unbind-key -T copy-mode WheelDownPane
unbind-key -T copy-mode DoubleClick1Pane
unbind-key -T copy-mode TripleClick1Pane
unbind-key -T copy-mode-vi MouseDrag1Pane
unbind-key -T copy-mode-vi MouseDragEnd1Pane
unbind-key -T copy-mode-vi WheelUpPane
unbind-key -T copy-mode-vi WheelDownPane
unbind-key -T copy-mode-vi DoubleClick1Pane
unbind-key -T copy-mode-vi TripleClick1Pane

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Remap prefix from 'C-b' to 'C-Space'
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Navigate windows with Shift+Alt+h and Shift+Alt+l
bind -n M-H previous-window
bind -n M-L next-window

# Enable 24-bit color support
set-option -sa terminal-overrides ",xterm*:Tc"

# Set Catppuccin theme
set -g @catppuccin_flavour 'mocha' # or latte, frappe, macchiato

# Vi mode
setw -g mode-keys vi

# Vim-style copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Open splits in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Initialize TMUX plugin manager.
run '~/.config/tmux/plugins/tpm/tpm'

# Keep OSC 52 yanking authoritative after plugins initialize. The selection is
# loaded into tmux's buffer and explicitly relayed to the attached local terminal.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "tmux load-buffer -w -"

# Refresh Kiro CLI socket variables when a new SSH client attaches.
set -ga update-environment " Q_PARENT"
